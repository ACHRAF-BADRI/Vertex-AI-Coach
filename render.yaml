services:
  - type: web
    name: ai-running-coach-backend
    runtime: docker
    rootDir: api
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
